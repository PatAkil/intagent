name: release

# Pushing a tag such as v0.1.0 publishes a GitHub release with archives for
# Linux, macOS and Windows, and the server image at ghcr.io/<owner>/intagent.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build the archives
        run: ./scripts/release.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v3
      # The image goes out before the release, which is the last step: a run
      # that fails before it publishes no release, and can be run again.
      - name: Publish the server image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "$image:$GITHUB_REF_NAME")
          # Pre-releases (v1.2.0-rc.1) do not move :latest.
          [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(-t "$image:latest")
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$GITHUB_REF_NAME" "${tags[@]}" .
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generated notes list merged pull requests, and a release without
          # any is a single changelog link, so the notes start with what to
          # download.
          notes="Download the archive for your system and check it against SHA256SUMS; each holds the intagent \
          binary, README.md, LICENSE, NOTICE and docs. On macOS the binary is not signed: if a browser downloaded \
          it, run \`xattr -d com.apple.quarantine intagent\` once. The server image is \
          \`ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME\`, for amd64 and arm64."
          # Pre-releases are marked as such, so they do not become the latest release either.
          pre=()
          [[ "$GITHUB_REF_NAME" != *-* ]] || pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes \
            --verify-tag "${pre[@]}"
