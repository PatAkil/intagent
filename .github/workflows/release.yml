name: release

# Pushing a tag such as v0.1.0 publishes a GitHub release with archives for
# Linux, macOS and Windows, and the server image at ghcr.io/<owner>/intagent.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Archives are built with the newest Go 1.27 release, which gets
      # security fixes; go.mod's go line is only the oldest Go that builds
      # intagent.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build the archives
        run: ./scripts/release.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v3
      # The image goes out before the release, which is the last step: a run
      # that fails before it publishes no release, and can be run again.
      - name: Publish the server image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "$image:$GITHUB_REF_NAME")
          # Pre-releases (v1.2.0-rc.1) do not move :latest.
          [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(-t "$image:latest")
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$GITHUB_REF_NAME" "${tags[@]}" .
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-releases are marked as such, so they do not become the latest release either.
          args=(--title "$GITHUB_REF_NAME" --verify-tag)
          [[ "$GITHUB_REF_NAME" != *-* ]] || args+=(--prerelease)
          # A release's own notes, docs/releases/<tag>.md, are its whole page.
          # Without them, generated notes list merged pull requests, and a
          # release without any is a single changelog link, so a fixed note
          # comes first, saying what to download.
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$notes_file" ]]; then
            args+=(--notes-file "$notes_file")
          else
            notes="Download the archive for your system and check it against SHA256SUMS; each holds the intagent \
          binary, README.md, LICENSE, NOTICE and docs. On macOS the binary is not signed: if a browser downloaded \
          it, run \`xattr -d com.apple.quarantine intagent\` once. The server image is \
          \`ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME\`, for amd64 and arm64."
            args+=(--notes "$notes" --generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
