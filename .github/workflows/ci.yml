name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The release is built with Go 1.27, so it is tested on both systems with
  # it. go.mod's go line is the oldest Go intagent builds with, for
  # 'go install'; one job tests with that, so the line stays true.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.27.x']
        include:
          - os: ubuntu-latest
            go: go.mod
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
      - name: Test with the race detector
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/intagent
      - name: Vet for Windows (its file lock is Windows-only code)
        run: GOOS=windows go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # golangci-lint v2.5 is built with Go 1.25 and type-checks the standard
      # library from source, which it cannot do for Go 1.26 or later ("file
      # requires newer Go version"), so it runs on go.mod's Go. Later
      # versions, built with Go 1.27, report new gosec findings to look into
      # first.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5

  # The server image still builds.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg VERSION=ci -t intagent:ci . && docker run --rm intagent:ci version

  # The real Codex, Copilot CLI and Gemini CLI, at pinned versions, against a
  # scripted model: offline, free and deterministic, so they run on every change.
  agents:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, copilot, gemini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Codex's sandbox is bubblewrap, which needs user namespaces; Ubuntu 24.04
      # keeps them from unprivileged users through AppArmor.
      - name: Let Codex's sandbox create user namespaces
        if: matrix.agent == 'codex'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end with ${{ matrix.agent }}
        run: ./scripts/e2e-${{ matrix.agent }}.sh
