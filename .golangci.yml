version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
    gosec:
      excludes:
        - G204 # running git with arguments is the point of internal/gitx
        - G304 # reading files named by the user or by git is the point
        - G301 # repository files such as .claude/ are meant to be readable
        - G306
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: receiver-naming
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, unparam]
formatters:
  enable:
    - gofmt
    - goimports
